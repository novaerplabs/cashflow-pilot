<?xml version="1.0" encoding="UTF-8"?>
<!-- CashFlow Pilot — store banner. Export to 1200x630 PNG (< 1MB). -->
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lineb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgb)"/>

  <!-- left: message -->
  <text x="80" y="210" font-family="Arial, Helvetica, sans-serif" font-size="34"
        letter-spacing="4" fill="#5eead4">CASHFLOW PILOT</text>
  <text x="78" y="300" font-family="Arial, Helvetica, sans-serif" font-size="76"
        font-weight="bold" fill="#ffffff">See 13 weeks</text>
  <text x="78" y="386" font-family="Arial, Helvetica, sans-serif" font-size="76"
        font-weight="bold" fill="#ffffff">ahead.</text>
  <text x="80" y="452" font-family="Arial, Helvetica, sans-serif" font-size="30"
        fill="#cbd5e1">Zero-config cash flow forecast for Odoo.</text>

  <!-- pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0f172a">
    <rect x="80"  y="490" width="150" height="46" rx="23" fill="#5eead4"/>
    <text x="103" y="520">100% Free</text>
    <rect x="246" y="490" width="120" height="46" rx="23" fill="#f8fafc"/>
    <text x="272" y="520">Odoo 19</text>
    <rect x="382" y="490" width="300" height="46" rx="23" fill="#f8fafc"/>
    <text x="405" y="520">Community &amp; Enterprise</text>
  </g>

  <!-- right: forecast chart mock -->
  <g transform="translate(760,150)">
    <rect x="0" y="0" width="360" height="330" rx="18" fill="#ffffff" opacity="0.06"/>
    <!-- bars -->
    <g>
      <rect x="34"  y="210" width="34" height="80"  rx="6" fill="#0d5f58"/>
      <rect x="94"  y="170" width="34" height="120" rx="6" fill="#0d5f58"/>
      <rect x="154" y="192" width="34" height="98"  rx="6" fill="#0d5f58"/>
      <rect x="214" y="132" width="34" height="158" rx="6" fill="#0d5f58"/>
      <rect x="274" y="150" width="34" height="140" rx="6" fill="#0d5f58"/>
    </g>
    <!-- threshold -->
    <line x1="24" y1="228" x2="320" y2="228" stroke="#5eead4" stroke-width="3"
          stroke-dasharray="10 8" opacity="0.6"/>
    <!-- trend -->
    <polyline points="51,210 111,170 171,192 231,132 291,150"
              fill="none" stroke="url(#lineb)" stroke-width="7"
              stroke-linecap="round" stroke-linejoin="round"/>
    <!-- low point -->
    <circle cx="111" cy="170" r="12" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
    <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18"
          fill="#f59e0b" font-weight="bold">Low point</text>
  </g>
</svg>
